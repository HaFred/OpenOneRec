hydra:
  searchpath:
    - pkg://verl.trainer.config

defaults:
  - ppo_trainer
  - _self_

trainer:
  project_name: verl-recsys

recsys:
  model:
    family: hstu
  training:
    mode: onpolicy_distill
    enable_async: false
    smoke_build_only: false
  model_engine:
    # roadmap alignment: prefer new model engine, keep legacy fallback
    mode: new
  rollout:
    backend: vllm
    mode: sync
    enable_profile: true
    enable_router_replay: false
  checkpoint:
    backend: local_fs
    manager_enabled: true
  agent_loop:
    allow_multi_output: true
  distillation:
    # roadmap alignment: multi-teacher support entrypoint contract
    teacher_model_paths: []
  objective:
    # choices: distill_hybrid, policy_only_grpo, actor_critic_gae, gr2_dapo
    name: distill_hybrid
    use_critic: true
    use_reference_policy: true
    gr2:
      enable_two_stage_rollout: true
      clip_ratio_low: 0.2
      clip_ratio_high: 0.28
      loss_agg_mode: token-mean
      stage1_max_tokens: 1024
      stage2_max_tokens: 16
      stage2_beam_size: 8
      order_similarity_threshold: 0.9
      order_penalty_weight: 0.5
      min_base_reward_for_penalty: 0.0
      generated_order_key: generated_items
      original_order_key: original_items
      overlong_buffer:
        enable: false
        len: 4096
        penalty_factor: 1.0
        log: false
  reward_adapter:
    alpha_click: 1.0
    alpha_watchtime: 0.0
  acceleration:
    enable_async_rollout: false
    enable_async_reward: false
    enable_fused_kernels: false
    enable_sequence_balance: false

reward_model:
  reward_manager: multi
