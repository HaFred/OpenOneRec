hydra:
  searchpath:
    - pkg://verl.trainer.config

defaults:
  - ppo_trainer
  - _self_

trainer:
  project_name: verl-recsys

recsys:
  model:
    family: hstu
  training:
    mode: onpolicy_distill
    enable_async: false
    smoke_build_only: false
  model_engine:
    # roadmap alignment: prefer new model engine, keep legacy fallback
    mode: new
  rollout:
    backend: vllm
    mode: sync
    enable_profile: true
    enable_router_replay: false
  checkpoint:
    backend: local_fs
    manager_enabled: true
  agent_loop:
    allow_multi_output: true
  distillation:
    # roadmap alignment: multi-teacher support entrypoint contract
    teacher_model_paths: []
  objective:
    # choices: distill_hybrid, policy_only_grpo, actor_critic_gae
    name: distill_hybrid
    use_critic: true
    use_reference_policy: true
  reward_adapter:
    alpha_click: 1.0
    alpha_watchtime: 0.0
  acceleration:
    enable_async_rollout: false
    enable_async_reward: false
    enable_fused_kernels: false
    enable_sequence_balance: false

reward_model:
  reward_manager: multi
