hydra:
  searchpath:
    - pkg://verl.trainer.config

defaults:
  - ppo_trainer
  - _self_

trainer:
  project_name: verl-recsys-dryrun
  experiment_name: dryrun
  logger: ["console"]
  total_epochs: 1
  test_freq: -1
  val_before_train: false

data:
  # Placeholder paths used for config-only dry-run checks.
  train_files: /tmp/recsys_dryrun_train.parquet
  val_files: /tmp/recsys_dryrun_val.parquet
  train_batch_size: 1
  max_prompt_length: 64
  max_response_length: 64

actor_rollout_ref:
  model:
    path: /tmp/recsys_dryrun_student_model
  ref:
    model:
      path: /tmp/recsys_dryrun_teacher_model
  rollout:
    name: vllm
    mode: sync
    n: 1

recsys:
  model:
    family: hstu
  training:
    mode: onpolicy_distill
    enable_async: false
    smoke_build_only: true
  rollout:
    backend: vllm
    mode: sync
    enable_profile: false
    enable_router_replay: false
  distillation:
    teacher_model_paths:
      - /tmp/recsys_dryrun_teacher_model
  objective:
    name: distill_hybrid
    use_critic: true
    use_reference_policy: true
    gr2:
      enable_two_stage_rollout: true
      clip_ratio_low: 0.2
      clip_ratio_high: 0.28
      loss_agg_mode: token-mean
      stage1_max_tokens: 256
      stage2_max_tokens: 8
      stage2_beam_size: 2
      order_similarity_threshold: 0.9
      order_penalty_weight: 0.5
      min_base_reward_for_penalty: 0.0
      generated_order_key: generated_items
      original_order_key: original_items
      overlong_buffer:
        enable: false
        len: 128
        penalty_factor: 1.0
        log: false
  reward_adapter:
    alpha_click: 1.0
    alpha_watchtime: 0.0
  acceleration:
    enable_async_rollout: false
    enable_async_reward: false
    enable_fused_kernels: false
    enable_sequence_balance: false
