hydra:
  searchpath:
    - pkg://verl.trainer.config

defaults:
  - ppo_trainer
  - _self_

trainer:
  project_name: verl-recsys-dryrun
  experiment_name: dryrun
  logger: ["console"]
  total_epochs: 1
  test_freq: -1
  val_before_train: false

data:
  # Placeholder paths used for config-only dry-run checks.
  train_files: /tmp/recsys_dryrun_train.parquet
  val_files: /tmp/recsys_dryrun_val.parquet
  train_batch_size: 1
  max_prompt_length: 64
  max_response_length: 64

actor_rollout_ref:
  model:
    path: /tmp/recsys_dryrun_student_model
  ref:
    model:
      path: /tmp/recsys_dryrun_teacher_model
  rollout:
    name: vllm
    mode: sync
    n: 1

recsys:
  model:
    family: hstu
  training:
    mode: onpolicy_distill
    enable_async: false
    smoke_build_only: true
  rollout:
    backend: vllm
    mode: sync
    enable_profile: false
    enable_router_replay: false
  distillation:
    teacher_model_paths:
      - /tmp/recsys_dryrun_teacher_model
  objective:
    name: distill_hybrid
    use_critic: true
    use_reference_policy: true
  reward_adapter:
    alpha_click: 1.0
    alpha_watchtime: 0.0
  acceleration:
    enable_async_rollout: false
    enable_async_reward: false
    enable_fused_kernels: false
    enable_sequence_balance: false
